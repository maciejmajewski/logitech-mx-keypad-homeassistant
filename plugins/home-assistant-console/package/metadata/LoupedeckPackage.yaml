# Plugin manifest. Field reference:
# https://logitech.github.io/actions-sdk-docs/csharp/tutorial/plugin-structure/
type: plugin4

# Immutable identifier once published. Also names the log file
# (HomeAssistantConsole.log) and the reload deep link
# (loupedeck://plugin/HomeAssistantConsole/reload).
name: HomeAssistantConsole
displayName: Home Assistant Console
description: Live Home Assistant entity tiles on the MX Creative Console; one press toggles the entity, the key face follows its state over the Home Assistant WebSocket API.

# Keep in sync with package.json.
version: 0.1.0

author: Maciej Majewski
copyright: Copyright © 2026 Maciej Majewski
minimumLoupedeckVersion: 6.3

pluginType: remote
pluginRuntime: nodejs
entryPoint: index.mjs

# macOS only: the plugin reloads itself through the loupedeck:// deep link
# with `open`. Omitting pluginFolderWin marks Windows as unsupported.
pluginFolderMac: .

# MX Creative Keypad: nine LCD keys, all command actions.
supportedDevices:
    - MxCreativeKeypad

pluginCapabilities:
    - HasNoApplication

license: MIT
licenseUrl: https://github.com/maciejmajewski/logitech-mx-keypad-homeassistant/blob/main/LICENSE
supportPageUrl: https://github.com/maciejmajewski/logitech-mx-keypad-homeassistant/issues
homePageUrl: https://github.com/maciejmajewski/logitech-mx-keypad-homeassistant
